[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmatau"
version = "0.1.0"
description = "Clock-stability analysis (Allan/Hadamard deviations and friends) — a Python port of SigmaTau.jl, validated against it as the reference oracle."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ian Lapinski", email = "ianlapinski01@gmail.com" }]
keywords = ["allan deviation", "frequency stability", "clock", "metrology", "time and frequency"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/ianlap/sigmatau"
"Reference implementation" = "https://github.com/ianlap/SigmaTau.jl"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmatau"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/sigmatau"]
warn_unused_ignores = true
